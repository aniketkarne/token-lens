# token-lens configuration
# Docs: https://github.com/aniketkarne/token-lens

tokenizer:
  backend: auto
  model: gpt-4o
  # custom_path: ./my-tokenizer.json

budgets:
  total_tokens: 12000
  zones:
    tool_schema: 2000
    history: 4000
    rag: 5000
  cost_usd: 0.03

ingest:
  jsonl:
    - ./logs/requests.jsonl
  # langfuse:
  #   Uncomment and fill in your credentials. token-lens reads LANGFUSE_PUBLIC_KEY
  #   and LANGFUSE_SECRET_KEY from the environment when these are blank.
  #   public_key: YOUR_LANGFUSE_PUBLIC_KEY
  #   secret_key: YOUR_LANGFUSE_SECRET_KEY
  #   host: https://cloud.langfuse.com

recommendations:
  min_chunk_usefulness: 0.15
  min_eval_sample_size: 30